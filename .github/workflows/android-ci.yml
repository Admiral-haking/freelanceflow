name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace || gradle :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: freelanceflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
